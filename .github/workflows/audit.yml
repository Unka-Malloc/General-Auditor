name: Public repository audit
run-name: Public audit · ${{ inputs.repository || 'changed repositories' }}

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Exact owner/repository, or all for an explicit full inventory audit'
        required: true
        type: string
        default: all

permissions: {}

# One report writer; queued runs read the latest state after they start.
concurrency:
  group: central-public-audit
  queue: max

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      scan_exit: ${{ steps.scan.outputs.exit_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read public Git content and refresh the rolling report
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_EVENT: ${{ github.event_name }}
          AUDIT_REPOSITORY: ${{ inputs.repository }}
        shell: bash
        run: |
          exit_code=0
          if [ "$AUDIT_EVENT" = workflow_dispatch ]; then
            python3 -m general_auditor batch --repository "$AUDIT_REPOSITORY" || exit_code=$?
          else
            python3 -m general_auditor watch || exit_code=$?
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" != 0 ]; then
            echo 'One or more scans could not complete. Inspect the report; pattern warnings do not fail CI.' >> "$GITHUB_STEP_SUMMARY"
          fi
          test -f reports/index.html
      - name: Persist current report, observations and newly initialized profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports profiles
          if ! git diff --cached --quiet; then
            git commit -m 'report: refresh rolling public audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare the single HTML document for Pages
        run: |
          mkdir -p out/pages
          cp reports/index.html out/pages/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/pages
          retention-days: 1
  publish:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the current HTML report
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Surface infrastructure failures after publishing their report
        env:
          SCAN_EXIT: ${{ needs.audit.outputs.scan_exit }}
        run: test "$SCAN_EXIT" = 0
