name: Dispatch repository audits
run-name: Dispatch audits · ${{ inputs.repository || 'changed repositories' }}
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Exact owner/repository, or all'
        required: true
        type: string
        default: all
      force:
        description: 'Explicitly rescan unchanged heads'
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: audit-discovery
  queue: max
jobs:
  dispatch:
    if: github.ref == 'refs/heads/only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: only
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Dispatch each changed repository as soon as its discovery finishes
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_REPOSITORY: ${{ inputs.repository || 'all' }}
          AUDIT_FORCE: ${{ inputs.force || false }}
        run: |
          args=(coordinate --repository "$AUDIT_REPOSITORY")
          if [ "$AUDIT_FORCE" = true ]; then args+=(--force); fi
          python3 -m general_auditor "${args[@]}"
