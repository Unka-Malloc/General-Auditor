name: General-Auditor
description: Common and repository-specific advisory scanning without a cloud Agent
inputs:
  repository:
    description: Owner/repository identity used for selecting its central policy
    default: ${{ github.repository }}
  directory:
    description: Local Git checkout to read without executing its contents
    default: .
  head:
    description: Immutable candidate commit
    default: ${{ github.sha }}
  base:
    description: Optional previous commit; checkout must include full ancestry
    default: ''
  scope:
    description: Optional auto, snapshot, range, history, staged or worktree scope
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        AUDITOR_PATH: ${{ github.action_path }}
        AUDIT_REPOSITORY: ${{ inputs.repository }}
        AUDIT_DIRECTORY: ${{ inputs.directory }}
        AUDIT_SCOPE: ${{ inputs.scope }}
        AUDIT_HEAD: ${{ inputs.head }}
        AUDIT_BASE: ${{ inputs.base }}
        AUDIT_TRIGGER: ${{ github.event_name }}
        AUDIT_EVENT: ${{ github.event_path }}
      run: |
        if [[ "$AUDIT_SCOPE" == auto ]]; then AUDIT_SCOPE=""; fi
        args=(check --repository "$AUDIT_REPOSITORY" --directory "$AUDIT_DIRECTORY" --head "$AUDIT_HEAD" --policy-root "$AUDITOR_PATH" --event "$AUDIT_EVENT" --trigger "$AUDIT_TRIGGER")
        if [[ -n "$AUDIT_SCOPE" ]]; then
          args+=(--scope "$AUDIT_SCOPE")
        fi
        if [[ ( -z "$AUDIT_SCOPE" || "$AUDIT_SCOPE" == range ) && -n "$AUDIT_BASE" && "$AUDIT_BASE" != 0000000000000000000000000000000000000000 ]]; then
          args+=(--base "$AUDIT_BASE")
        fi
        python3 -I "$AUDITOR_PATH/action_entry.py" "${args[@]}"
